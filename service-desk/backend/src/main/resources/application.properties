spring.application.name=service-desk
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/desk}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8097/realms/review}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS:http://localhost:8097/realms/review/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=service-desk-api
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health
server.shutdown=graceful
