name: Spark ingestion
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ingestion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d ingestion_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -r requirements-test.lock
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test:test-only@localhost:5432/ingestion_test
          SPARK_LOCAL_IP: 127.0.0.1
          RUN_DOCKER_TESTS: "1"
      - run: python scripts/configure.py
      - run: docker compose up --build -d
      - run: docker compose run --rm --no-deps -e API_URL=http://api:8080 worker python -m scripts.smoke
      - if: always()
        run: docker compose down -v --remove-orphans
